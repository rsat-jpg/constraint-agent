[project]
name = "verifiable-planning"
version = "0.1.0"
description = "Structural validation for multi-step agent plans (Plan-Validate-Execute)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Adapter uses an injected completer only — no SDK pin.
# Extra exists so installs can opt into adapter docs/tests grouping later.
llm = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verifiable_planning*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
